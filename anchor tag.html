    <h1>Anchor tag</h1>
    <p> By anchor tag we can attach links to other web pages.But adding a attribute like target which allows the link to open in a new tab or window    </p>
    <a href="https://google.com"> Google </a>
    </br>
    <a href="https://google.com" target="_main"> Google </a> <!-- This is an anchor tag with target attribute set to _main -->
    </br>
    <hr>
