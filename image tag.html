<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Tag Example</title>
</head>
<body>
    <h1>Image tag</h1>
    <p> By image tag we can attach images to our web pages. But adding a attribute like alt which allows the image to have an alternative text when the image is not found or not loaded. </p>
    </br>
    <img src="/gojo.jpg" alt="Random Image">
    </br>
    <hr>
    <h1> Image tag size adjustments</h1>
    <p><b>By using width and height attribute we can adjust the size of the image.  </b></p>
    </br>
    <img src="/gojo.jpg" alt="Random Image" width="200" height="200">
    </br>
</body>
</html>
